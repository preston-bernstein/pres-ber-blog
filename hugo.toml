######################## default configuration ####################
# The base URL of your site (required). This will be prepended to all relative URLs.
baseURL = "https://prestonbernstein.com/"
# Title of your website (required).
title = "Preston Bernstein"
# Your theme name
theme = "blowfish"
# Default time zone for time stamps; use any valid tz database name: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
timeZone = "America/New_York"
# post excerpt
summaryLength = 10 # see https://gohugo.io/content-management/excerpts/
# disable language
disableLanguages = [
] # example: ["fr"] for disable french language. see https://gohugo.io/content-management/multilingual/
hasCJKLanguage = false #  If hasCJKLanguage true, auto-detect Chinese/Japanese/Korean Languages in the content. see: https://gohugo.io/getting-started/configuration/#hascjklanguage
# default language
defaultContentLanguage = 'en'
# defaultContentLanguageInSubdir need to be true if you want to use the language code as a subdirectory and language specific 404 page
defaultContentLanguageInSubdir = false

########################### Services #############################
# Analytics run through Google Tag Manager (layouts/partials/extend-head.html,
# gated on the real google_tag_manager param in params.toml) -- Hugo's own
# internal Google Analytics service below used a literal placeholder ID that
# was never replaced, firing a dead gtag.js request on every pageview.
[services]
[services.disqus]
shortname = 'prestonbernstein' # we use disqus to show comments in blog posts . To install disqus please follow this tutorial https://portfolio.peter-baumgartner.net/2017/09/10/how-to-install-disqus-on-hugo/

########################## Taxonomies #############################
[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

########################## Permalinks ############################
[permalinks.page]
"pages" = "/:slugorcontentbasename/"

########################## Pagination #############################
# `paginate` (top-level key) was Hugo's pre-0.128 pagination setting; Hugo
# 0.164.0 silently ignores it in favor of [pagination].pagerSize -- confirmed
# via `hugo config`, which reported pagersize=10 (the framework default) even
# with the old key set to 15.
[pagination]
pagerSize = 15


############################# Modules ############################
[module]
[[module.mounts]]
source = "assets"
target = "assets"

############################# Build ##############################
# buildStats + the hugo_stats.json mount + the two cachebusters below existed
# to feed Tailwind's JIT purge step (the classic Hugo+Tailwind recipe). This
# site has no site-level CSS/JS entry point for Hugo Pipes to process --
# Blowfish ships its own precompiled CSS (resources.Get "css/compiled/main.css")
# -- so that pipeline never actually ran; removed along with tailwind.config.js
# and postcss.config.js. The remaining generic cachebusters stay: they're
# Hugo's own recommended defaults and apply correctly if a site-level
# assets/*.css or assets/*.js is ever added.
[build]
noJSConfigInAssets = false
useResourceCacheWhen = 'fallback'
[[build.cachebusters]]
source = 'assets/.*\.(js|ts|jsx|tsx)'
target = 'js'
[[build.cachebusters]]
source = 'assets/.*\.(css|scss|sass)'
target = 'css'
[[build.cachebusters]]
source = 'data/.*\.(.*)$'
target = 'css'
[[build.cachebusters]]
source = 'assets/.*\.(.*)$'
target = '$1'


############################# Outputs ############################
[outputs]
home = ["HTML", "RSS", "JSON"]

############################# Imaging ############################
# top-level [imaging].quality was deprecated in Hugo v0.163.0 (this site
# builds on 0.164.0) in favor of per-format quality settings.
[imaging]
resampleFilter = "Lanczos"
[imaging.jpeg]
quality = 80
[imaging.webp]
quality = 80

############################ Caches ##############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


############################ Markup ##############################
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai' # see https://xyproto.github.io/splash/docs/all.html

[markup.tableOfContents]
startLevel = 2
endLevel = 5
# Blowfish's TOC-visibility check (layouts/_default/single.html) looks for a
# literal "<ul" in the generated TOC HTML -- an ordered list (<ol>, Hugoplate's
# old setting) makes Blowfish treat the TOC as empty and silently hide it, with
# no build error. Found via browser-driven verification (requirement 16).
ordered = false
