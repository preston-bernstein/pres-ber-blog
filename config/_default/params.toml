#################### default parameters ################################
# Main Sections
mainSections = ["blog"]

# Blowfish theme: site logo, relative to the assets/ folder (see
# themes/blowfish/exampleSite/config/_default/languages.en.toml `params.logo`).
# Uses the site's avatar image, not the old images/logo.png -- that file still had
# Hugoplate's own name baked into the artwork, a leftover from the old theme with
# no replacement asset in this repo, caught during browser-driven verification.
logo = "images/avatar.png"

# Blowfish theme: appearance / colour-scheme defaults (see
# themes/blowfish/exampleSite/config/_default/params.toml)
colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true

# Blowfish theme: sticky/scrollspy table of contents on blog posts (this migration's
# requirement 16) -- must stay a bare top-level key, not inside a [table] header,
# since TOML reparents any bare key that follows a header under that table.
smartTOC = true
smartTOCHideUnfocusedChildren = false

# Blowfish theme: copy-to-clipboard button on every fenced code block
# (docs/markup-2026-baseline/) -- ships in themes/blowfish/assets/js/code.js, but
# that script is only bundled into the page when this param is true (see
# themes/blowfish/layouts/partials/head.html's `enableCodeCopy` gate). Left at its
# default (false) since the Blowfish migration, so the copy button never actually
# rendered despite the JS being present -- caught by a Playwright assertion added
# in this pass (tests/e2e/blog-post-content.spec.js), not by inspection alone.
enableCodeCopy = true

# google tag manager, see https://developers.google.com/tag-manager/
google_tag_manager = "GTM-5DSQPKJJ" # example: G-XXXXXXXXXX
# copyright -- "{ year }" is Blowfish's own placeholder token (layouts/partials/footer.html,
# layouts/_default/rss.xml both do `replace .Site.Params.copyright "{ year }" now.Year`),
# not a Go template expression -- keeps the year current without a stale hardcoded value.
copyright = "© { year } by Preston Bernstein. <b>All rights reserved.</b>"

# seo meta data for OpenGraph / Twitter Card -- Blowfish reads these as bare
# top-level Site.Params keys (themes/blowfish/layouts/partials/head.html), not
# nested under [metadata] (Hugoplate's shape). The nested version was silently
# inert: the live site shipped with no <meta name="description"> and no
# og:image/twitter:image at all, confirmed via a real build before this fix.
# Must stay above [article]/[footer] below -- same TOML reparenting rule as
# smartTOC above.
keywords = ["Blog", "Hugo"]
description = "Preston Bernstein is an Atlanta-based full-stack developer writing about home-lab infrastructure, self-hosted services, and AI agent engineering."
# Home-page-only <title> (layouts/partials/head.html override). Keeps the short
# site title as the " · " suffix on every other page.
homepageTitle = "Preston Bernstein — Full-Stack Developer, Home Lab & AI Agent Engineering"
defaultSocialImage = "images/og-image.png"

# Blowfish theme: sticky/scrollspy TOC (requirement 16) and the "zen reading mode"
# that was the deciding factor for choosing Blowfish over Congo (see
# docs/hugo-theme-refresh/plan.md Design decisions) -- must come after all the bare
# top-level keys above and before [footer], same reparenting rule as above.
[article]
  showTableOfContents = true
  showHeadingAnchors = true
  showZenMode = true
  # Wired to Hugo's built-in Disqus template via layouts/partials/comments.html
  # (requirement 8) -- [services.disqus] in hugo.toml has a real shortname.
  showComments = true
  # Single-author personal site: identity is already in the nav/footer/home
  # profile on every page. The theme's per-post author byline (layouts/partials/
  # partials/author.html, gated by this flag) duplicated that with the SAME
  # person, and a second unconditional block (author-extra.html, driven by the
  # front matter `authors:` list, no config gate) rendered a THIRD time under it
  # -- confirmed live 2026-08-10 on /blog/github-agents-tab-vs-claude-code/,
  # two identical "Preston Bernstein" boxes stacked on one post. This flag kills
  # the first; author-extra.html is overridden to empty at layouts/partials/
  # author-extra.html (site-level, not the theme submodule) to kill the second
  # without touching front matter `authors:`, which schema.html still reads for
  # Article JSON-LD structured data (SEO value, invisible to the reader).
  showAuthor = false

# Blowfish theme: site footer (must stay above the first [table] header below,
# otherwise the bare keys above would be silently reparented under [footer])
[footer]
  showAppearanceSwitcher = true

# announcement
# announcement module: https://github.com/gethugothemes/hugo-modules/tree/master/components/announcement
# [announcement]
# enable = true
# expire_days = 7
# content = "You must replace the **baseURL** in **hugo.toml** file when deploying, you can manage this announcement from the **params.toml** file."

# site verification codes -- Blowfish reads these under [verification], not
# [site_verification] (Hugoplate's shape), and under different sub-keys
# (google/bing/pinterest/yandex/fediverse, not baidu/facebook/mastodon). All
# codes are currently unset, so this section is commented out rather than
# emitted empty; uncomment and fill in under [verification] if ever needed.
# [verification]
# google = ""
# bing = ""
# pinterest = ""
# yandex = ""
# fediverse = ""

# Blowfish theme: site-wide default author (see
# themes/blowfish/exampleSite/config/_default/languages.en.toml `params.author`).
# NOTE: this file's own top-level keys already map to `Site.Params.*` (this is
# config/_default/params.toml, not config/_default/hugo.toml), so the section
# header here must be `[author]`, not `[params.author]` -- the latter double-nests
# to Site.Params.Params.Author, which Blowfish's templates (home/profile.html,
# author.html) never read, silently dropping the bio/image/links. Confirmed via
# `hugo config` dump and a build showing the bio text and avatar <img> both
# absent from public/index.html before this fix.
[author]
  # Duplicated (not aliased) in data/authors/preston-bernstein.json for
  # per-article bylines -- Blowfish reads this table for the site-wide profile
  # block, that file for `hugo.Data.authors`. Update both on any bio/link change.
  name = "Preston Bernstein"
  email = "contact@prestonbernstein.com"
  image = "images/avatar.png"
  bio = "A full-stack developer based in Atlanta with over 10 years of experience building and optimizing web apps, focused on user experience, performance, and helping other developers grow into leaders."
  links = [
    { github = "https://github.com/preston-bernstein" },
    { linkedin = "https://www.linkedin.com/in/prestonbernstein/" },
  ]
