# Not the active deploy path -- the live site deploys via .github/workflows/main.yml.
# Kept as a legacy/alternate GitLab CI config (see readme.md Deploy section).
# NOTE: unlike main.yml, this file does not set `GIT_SUBMODULE_STRATEGY`, so it
# will not fetch the themes/blowfish git submodule as-is -- add
# `GIT_SUBMODULE_STRATEGY: recursive` to `variables` before relying on this path.
stages:
  - build

variables:
  HUGO_ENV: production
  HUGO_VERSION: "0.164.0"
  NODE_VERSION: "lts"

cache:
  paths:
    - node_modules/

default:
  image: node:${NODE_VERSION}
  before_script:
    - echo "USING NODE ${NODE_VERSION}"
    - apt-get update && apt-get install -y curl
    - curl -LO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz"
    - tar -xvf hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz
    - mv hugo /usr/local/bin/
    - rm hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz
    - echo "HUGO ${HUGO_VERSION} INSTALLED"
    - npm install

pages:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - public
