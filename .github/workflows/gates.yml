name: Stack gates

# One job runs the pack gates that need no site build. A second job runs the JavaScript gate,
# which builds the site and runs the browser tests. main.yml already lints and tests on push to
# main, so this workflow skips main to run each gate once.

defaults:
  run:
    shell: bash

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  GATE_BIN: ${{ github.workspace }}/../gate-bin

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static-gates:
    name: Core, Actions, shell and writing gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The writing gate diffs against origin/main, so it needs the full history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install gate tools
        run: |
          npm ci --ignore-scripts
          pip install --require-hashes -r scripts/gate-requirements.txt
          bash scripts/install-gate-tools.sh "$GATE_BIN"
          echo "$GATE_BIN" >> "$GITHUB_PATH"
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Core gate
        run: bash scripts/core-validate.sh

      - name: Script tests
        run: python3 -m unittest discover -s tests/py -t tests/py

      - name: GitHub Actions gate
        run: bash scripts/gha-validate.sh

      - name: Shell gate
        run: bash scripts/shell-validate.sh

      - name: Writing gate
        run: bash scripts/writing-validate.sh

  js-gate:
    name: JavaScript gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Hugo
        run: bash scripts/install-gate-tools.sh "$GATE_BIN" hugo

      - name: Install dependencies
        run: |
          echo "$GATE_BIN" >> "$GITHUB_PATH"
          npm ci
          npx playwright install --with-deps chromium

      # Same commit pin as main.yml: an upstream change cannot break the build unseen.
      - name: Install linkblog-commons
        run: pip install "git+https://github.com/preston-bernstein/linkblog-commons.git@f12f008aed587d7d643db8ec5b787f60474ee96a"

      - name: Build linkblog content
        run: python3 scripts/build-linkblog.py

      - name: JavaScript gate
        run: bash scripts/js-validate.sh
