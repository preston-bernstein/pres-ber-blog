name: GEO Gate (PRs and branches)

defaults:
  run:
    shell: bash

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

  workflow_dispatch:
env:
  HUGO_ENV: production
  HUGO_VERSION: 0.164.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-gate:
    name: Build and run GEO gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install Hugo
        run: |
          curl -LO "https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz"
          tar -xvf hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/
          rm hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
          hugo version

      - name: Install npm dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: GEO gate
        run: python3 scripts/geo-gate.py
