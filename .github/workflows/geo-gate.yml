name: GEO Gate (PRs and branches)

defaults:
  run:
    shell: bash

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

env:
  HUGO_ENV: production
  HUGO_VERSION: 0.164.0

jobs:
  build-gate:
    name: Build and run GEO gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo codebase
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          clean: true
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install Hugo
        run: |
          curl -LO "https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz"
          tar -xvf hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/
          rm hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
          hugo version

      - name: Install npm dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: GEO gate
        run: python3 scripts/geo-gate.py
