name: Deploy Hugo Site via FTP

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - main

  workflow_dispatch:
env:
  HUGO_ENV: production
  HUGO_VERSION: 0.164.0
  SITE_FOLDER: prestonbernstein.com

permissions:
  contents: read

jobs:
  build-deploy:
    name: Build and deploy
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install Hugo
        run: |
          curl -LO "https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz"
          tar -xvf hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/
          rm hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
          hugo version

      - name: Install npm dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11'

      # linkblog-commons is a private repo. LINKBLOG_COMMONS_PAT is a fine-grained
      # GitHub PAT scoped to Contents: Read-only on that one repo, stored as a repo
      # secret (Settings > Secrets and variables > Actions) -- provisioned manually,
      # CI cannot create it. Pinned to a commit SHA, not a branch, so an unrelated
      # upstream change can't silently break this repo's push-to-main deploy.
      - name: Install linkblog-commons
        run: pip install "git+https://x-access-token:${{ secrets.LINKBLOG_COMMONS_PAT }}@github.com/preston-bernstein/linkblog-commons.git@f12f008aed587d7d643db8ec5b787f60474ee96a"

      - name: Build linkblog content
        run: python3 scripts/build-linkblog.py

      - name: Build
        run: npm run build

      - name: GEO gate
        run: python3 scripts/geo-gate.py

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./public/
          server-dir: ./${{ env.SITE_FOLDER }}/
