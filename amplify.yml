# Not the active deploy path -- the live site deploys via .github/workflows/main.yml.
# Kept as a legacy/alternate Amplify config (see readme.md Deploy section).
# NOTE: unlike main.yml, this relies on Amplify's own "clone submodules"
# platform setting to pull in themes/blowfish -- confirm it's enabled for this
# app before relying on this path.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yum install -y curl
        - curl -LO "https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_Linux-64bit.tar.gz"
        - tar -xvf hugo_extended_0.164.0_Linux-64bit.tar.gz
        - mv hugo /usr/local/bin/
        - rm hugo_extended_0.164.0_Linux-64bit.tar.gz
        - echo "HUGO 0.164.0 INSTALLED"
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    # IMPORTANT - Please verify your build output directory
    baseDirectory: /public
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
